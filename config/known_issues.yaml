# ==============================================================================
# 已知问题台账（known-issues registry）· tdx-data-feed
# ==============================================================================
# 用途：让"每次检查都发现新漏洞"从统计错觉变成可管理的数据。
#   审计/巡检发现问题 → 先查本台账 → 命中则只更新 last_seen/seen_count/sources；
#   未命中且满足"可判定+有位置+有影响"三要素 → 新建条目。
#   报告口径改为「新增数 NEW」与「复现数 RECURRING」，不再报"发现总数"。
#
# 字段
#   id          稳定标识 KI-<主题码>-<序号>，一经分配永不复用、不重命名
#   title       一句话问题描述
#   theme       主题分类（见文末 themes）
#   severity    P0 阻断正确性 / P1 结构可靠性 / P2 工程质量
#   status      OPEN 待修 | ACCEPTED 已接受风险(需 exemption+due) | FIXED 已修(必须绑 guard)
#               | DEFERRED 延期(需 owner+due) | ARCHIVED 已归档(退出扫描范围)
#   first_seen  首次发现日期      last_seen 最近一次被检出日期
#   seen_count  累计被独立检出次数（不同轮次各计 1 次）
#   sources     检出来源（可多份；重复发现在此累积）
#   locations   当前代码位置（文件或 glob）
#   detect      判定规格（供 scripts/audit_ledger.py scan 复扫）
#               kind: grep | absent | lines_gt | glob_exists | glob_absent
#   impact      不修会怎样        guard  防复发守卫；NONE = 目前无守卫（复发根因）
#   owner       责任人            due    目标完成日期
#   exemption   当前被豁免/规则覆盖的依据（无则 NONE）
#   fix_hint    修复方向（历次审计的收敛结论）
#
# 记录规则
#   R1 登记前置：任何发现先 grep 本台账 title/detect，确认是否已登记
#   R2 命中更新：已登记 → 只更新 last_seen/seen_count/sources，不新增、不改 id
#   R3 新建门槛：未登记 + 可判定 + 有位置 + 有影响 → 新建
#   R4 主题归并：同主题不同位置 → 新建条目，fix_hint 标注"建议与 KI-xxx 合并治理"
#   R5 关闭条件：status=FIXED 必须填 guard（指向真实存在的测试文件或守卫命令）
#   R6 豁免条件：status=ACCEPTED 必须填 exemption 与 due；到期未处理自动回 OPEN
#   R7 归档条件：status=ARCHIVED 必须写明已退出扫描范围及替代资产位置
#   R8 计数口径：同一轮内同一条目只计 1 次；跨轮才算复发
#
# themes: silent-failure 静默失败 | atomicity 原子写与锁 | concurrency 调度竞态
#         single-source 单源与口径 | hardcode 硬编码与路径 | timeout 超时与阻塞
#         contract 契约与校验 | mcp MCP 层 | skill 技能与路由 | docs 文档漂移
#         perf 性能 | size 规模与结构 | ops 运维与调度 | make Makefile 口径
#         rule 规则与豁免
# ==============================================================================

meta:
  version: 1
  created: "2026-11-01"
  updated: "2026-11-01"
  owner: "jiuben"
  scan_command: "venv/bin/python scripts/audit_ledger.py scan"
