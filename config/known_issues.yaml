    impact: "该步是后续三个作业的 needs 上游，它一红 sync-vault / deploy-docs / pr-preview 全 skipped ⇒ 工作流注释里承诺的三件事（GitHub Wiki 同步、Obsidian Vault 同步、PR 预览评论）自可见的历史起**一次都没真正执行过**，红叉本身又只是「jq 用法错」而非业务失败。第二层代价是信号稀释：`trigger paths` 含 README.md / CONTRIBUTING.md / SECURITY.md / Makefile / DELIVERY.md / docs/**，于是任何动到这些文件的推送都会在 main 上多挂一条红（本条首次命中就是 f897ca2 改了 Makefile）；门禁判定虽然只认 tests.yml，但「CI 有红」这句话的可读性会被它持续污染。判据细节：工作流未显式声明 shell，GitHub 默认 `bash -e`，`JSON=$(... | jq -s .c)` 的命令替换失败使赋值返回非零并当场中止；同一支路只在 FILTERED 非空时进入，这解释了为什么绝大多数 push 轮是绿的——不是修好了，是没踩到"
