      2026-11-02（P1-9 批次 E）：核查确认 **ST 名称判定的实现本来就只有一处**
      （tdxfeed/names.py::is_st_name）——predict.is_st 与 limit_price.is_st 都是转发，
      find_double_up_c_v2.is_st(code, st_set) 判的是「代码在不在 ST 名单里」属另一契约。
      因此**不重构**，改为用 AST 守卫把既有事实固化：(1) 权威层外不得再定义 ST 判定函数，
      登记为「转发」的例外必须真的转发（函数体里调用 is_st_name）；
      (2) 内联 ST 字符串判定必须**逐条登记理由**——新增未登记必红；
      (3) 例外表不得腐化（登记了却已无命中 = 该重新评估）。
      计数有两套口径，别混：批次 E 记的「16 处」是**宽口径**（字符串含 ST 子串 + 「退」，按行去重），
      其中 9 处是已知误报（tests/、state、step、stage1、inst_net、industry_code、hist_bj、
      current_steps、OBSIDIAN_SYSTEMD:）；守卫用的是**精确 AST**（常量恰为 ST/*ST），当时 6 处 / 6 文件。
      2026-11-02（P1-12 Phase 2a/2b）：收编 3 处，精确口径降到 **3 处 / 3 文件**
      （find_double_30d 仅前缀匹配、factor_engine 与 find_double_up_c_v2 判 vault 文件名词干，
      三者口径与权威不同，逐条登记保留）。
      Phase 2a：find_double_up_hfq 的 is_st 改走 is_st_name（守卫 tests/test_find_double_up_hfq_st_source.py，
      端到端跑 main 验 is_st 列）。Phase 2b（方案 A）：新增 names.is_st_or_delisting
      = is_st_name(name) or 名称含「退」，收编 daban_min60_features 的 5% 档判定与
      daban/scanner.symbols 的候选过滤（守卫 tests/test_st_or_delisting.py，含转发断言与 symbols 行为测试）。
      **行为 diff 为 0**：宇宙 5221 只与 hfq 样本 17794 行逐条比对，两种口径翻转数均 0；
      唯一语义差是排版空格（"*S T康佳A" 旧写法漏判），真实名单里没有这种形态。
      第三处「退」（tdxfeed/daban/paper.py:299 → status="risk_warning"）**不收编**：
      它是状态分类不是候选过滤，合并会让 ST 名称也被打 risk_warning，属改口径。
    exemption: "NONE"
    fix_hint: "统一到 tdxfeed/names.py 的 is_st_name，并让 limit_price 与 predict 共用"

