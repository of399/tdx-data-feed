name: kline-analysis
llm:
  model_id: qwen3-14b-tdx
  base_model: Qwen/Qwen3-14B
  adapter_path: /home/jiuben/tdx-data-feed/train/output/qwen3-14b-tdx-v7
  inference:
    backend: transformers + peft
    dtype: bfloat16
    device_map: auto
    max_new_tokens: 256
    temperature: 0.0
prompt_template: "### 指令:\n根据以下股票近 {lookback} 个交易日的 K 线数据，判断未来 5 个交易日的涨跌方向、幅度及原因。\n\
  \n### 输入:\n{kline_json}\n\n### 回答:\n只输出一个 JSON 对象，不要输出 JSON 以外的解释文字。字段约定：\n- direction:\
  \ 整数，1=涨，0=平，-1=跌\n- pct: 数字，预期涨跌幅百分比，范围 -10.0 ~ 10.0\n- confidence: 数字，置信度，范围 0.0\
  \ ~ 1.0\n- reason: 字符串，不超过 100 字，必须基于输入 K 线\n\n```json\n{{\n  \"direction\": 1,\n\
  \  \"pct\": 2.5,\n  \"confidence\": 0.7,\n  \"reason\": \"...\"\n}}\n```\n"
fallback_skill: indicator-match
