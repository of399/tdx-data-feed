# tdx_v9_from_scratch.yaml — qwen3-14b-tdx v9 从零 QLoRA 训练（非破坏，独立目录）
# ======================================================================
# ⚠️ 用途：用户要求「从零重训 + 产出新版本」。本配置基于 tdx_lora_packed.yaml
#   （现役从零配方：adapter_name_or_path=null / 全量 80071 样本 / rank16 / ep3），
#   仅改 output_dir 为新版本目录，确保不覆盖现役 v7r / v7r1115 / v8 任何产物。
#
# 与现役 tdx_lora_packed.yaml 的差异（仅 1 处实质改）：
#   output_dir -> qwen3-14b-tdx-v9（独立目录，绝不触碰 v7r）
#
# 非破坏保证：
#   - adapter_name_or_path: null  → 从零训练，不读任何旧 checkpoint
#   - output_dir 独立             → 不覆盖 v7/v7-resume/v8/v4fwd 任何产物
#   - 部署名 qwen3-14b-tdx-v9     → Ollama 侧与 v7r 隔离
#
# 真实耗时：32–50h（按现役节奏 28s/步 × 6756 步估算；packing 提速后 32–38h）
# 监控：scripts/trainsh -w 5   （读 train/output/qwen3-14b-tdx-v9/trainer_log.jsonl）
# 日志：logs/train_tdx_v9_from_scratch.log
#
# 启动（单卡，限定 GPU0）：
#   CUDA_VISIBLE_DEVICES=0 venv/bin/python training/scripts/train_lora.py \
#       training/config/tdx_v9_from_scratch.yaml

# === 模型与数据（与现役从零配方一致）=====================================
model_name_or_path: /home/jiuben/models/Qwen3-14B   # 本地 HF 权重路径（避免联网）
adapter_name_or_path: null                  # 从零训练 LoRA
finetuning_type: lora
template: qwen
trust_remote_code: true

dataset_dir: /home/jiuben/tdx-data-feed/train/data    # 与现役一致（含 dataset_info.json）
dataset: tdx_v4fwd_train                  # 训练集映射名（v4fwd_train.jsonl，前瞻5日方向标签，平衡 涨33.8/跌39.8/震荡26.4%）
eval_dataset: tdx_v4fwd_val                # 验证集（v4fwd 前瞻标签；分布偏跌56%，仅监控用）
# test_dataset: tdx_v4_test  # ⚠️ 0.9.5 不支持 test_dataset 键, 已移除; 测试集留待离线评估(training/eval/run_v4_eval.py)
# split: split              # ⚠️ 0.9.5 HfArgumentParser 不识别 split 键, 已移除(数据集已是预切分的 train/val/test 三个独立文件, 天然防泄漏)
max_samples: 64056                          # v4fwd_train.jsonl 实际条数（原 80071 为 v4_train 旧值）

# === LoRA 超参（与现役从零一致，rank=16）=================================
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 16
lora_alpha: 32                              # alpha = 2 * rank 常用
lora_dropout: 0.05

# === 训练超参（与现役从零一致）===========================================
output_dir: /home/jiuben/tdx-data-feed/train/output/qwen3-14b-tdx-v9
overwrite_output_dir: false                  # 改为 false：中断后重跑可自动从最新 checkpoint 续训（异常恢复）
do_train: true                               # ⚠️ 必填：transformers 4.57 TrainingArguments.do_train 默认 False；缺失时 llamafactory 仅跑 eval（初始 8007 条 val eval 后 exit=0 静默退出，无训练 step/无 checkpoint）。2026-10-12 v9 首启踩坑修复
per_device_train_batch_size: 1
gradient_accumulation_steps: 16             # effective batch 16
num_train_epochs: 3.0
max_steps: 600                                   # 方案 B 2026-10-16 救火：ckpt-200 sanity 5 指标 FAILED(mode collapse, cls_acc_down=0.0)
                                                   # 缩短训练到 600 step(原 6006 = 3 epoch 需 32-50h),目标 3 次 sanity(200/400/600)
                                                   # 验证坍缩是否持续;若仍坍缩,优先排查根因(数据/超参)再决定是否重训
                                                   # 与 num_train_epochs 互斥:llamafactory 0.9.5 优先 max_steps
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
seed: 42

# === 序列与 packing =======================================================
cutoff_len: 512
packing: true                               # 多样本拼接 +20-40% 吞吐
# neftune_noise_alpha: 0  # ⚠️ 0.9.5 不支持该键, 已注释(原为 0 即关闭, 无影响)

# === 精度与显存优化 =======================================================
quantization_bit: 4                         # QLoRA 4bit
quantization_type: nf4
double_quantization: true                   # 双量化，省 0.4 bit/param
flash_attn: sdpa                            # 本环境 py3.14 无 cp314 fa2 wheel，回退 SDPA
# torch_compile: true  # ⚠️ 0.9.5 不支持该键(仅 v1.x), 去掉不影响正确性, 仅少一次编译加速
gradient_checkpointing: true
optim: paged_adamw_32bit                    # 8bit / paged 优化器

# === 日志与 checkpoint====================================================
logging_steps: 20
save_steps: 200
save_total_limit: 3
save_strategy: steps
eval_strategy: steps
eval_steps: 200
per_device_eval_batch_size: 1               # ⚠️ Qwen3-14B vocab=151936, batch=8 时 logits.float() 要 ~2.5GB → OOM on 16GB; 设为 1 (与 train batch 对齐)
load_best_model_at_end: false

# === 监控 ================================================================
report_to: none
dataloader_num_workers: 0                 # ⚠️ 4 时 py3.14 forkserver 偶发 BrokenPipe (间歇 OOM/pipe 抖动); 0 最稳, QLoRA GPU 是瓶颈, 数据加载开销可忽略
remove_unused_columns: false
bf16: true                                  # bfloat16（兼容 RTX 5060 Ti sm_120）
