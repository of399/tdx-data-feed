# Grafana 自动数据源配置
# 由 Grafana 启动时自动加载

apiVersion: 1

datasources:
  # -----------------------------------------------------------------------
  # Prometheus 主数据源
  # -----------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.50.0
      cacheLevel: High
      incrementalQuerying: true

  # -----------------------------------------------------------------------
  # PostgreSQL 数据源（直连数据库，用于回测明细）
  # -----------------------------------------------------------------------
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    database: ${POSTGRES_DB}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 1
      connMaxLifetime: 600
      postgresVersion: 1600
      timescaledb: false

  # -----------------------------------------------------------------------
  # Redis 数据源（用于查看缓存命中率 / 队列深度）
  # -----------------------------------------------------------------------
  - name: Redis
    type: redis
    access: proxy
    url: redis://redis:6379
    jsonData:
      authType: password
      secureAuth: true
    secureJsonData:
      password: ${REDIS_PASSWORD}