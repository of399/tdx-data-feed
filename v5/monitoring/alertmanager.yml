# Alertmanager 配置 · M3 W6 告警渠道
#
# 加载方式（prometheus.yml）:
#   alerting:
#     alertmanagers:
#       - static_configs:
#           - targets: ['127.0.0.1:9093']
#
# 启用 webhook / Slack / email 任一即可

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'  # 可选：email
  smtp_from: 'alerts@example.com'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password: 'xxxxx'  # 替换为实际密码

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-warnings'
      continue: true

receivers:
  # 默认：当前未配置任何 integration
  # ⚠️ 2026-09-21 webhook_configs 已注释（127.0.0.1:5001 无人接收，am 每 4h 重复失败无意义）
  # ⚠️ email/Slack 凭证是占位符 (oncall@example.com / <secret>)，需用户提供后才可启用
  - name: 'default'
    # webhook_configs:
    #   - url: 'http://127.0.0.1:5001/alerts'  # 可选 webhook 接收端 (DISABLED 2026-09-21)

  # 🔴 严重告警：推送到 PushPlus（个人微信）  2026-09-21 启用
  # 流程：alertmanager → pushplus_bridge (:5002) → pushplus.plus API → 微信
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://127.0.0.1:5002/pushplus'
        send_resolved: true
        max_alerts: 0  # 0 = 所有 alert 一次推送

  # 🟡 warning 告警：Slack
  # ⚠️ 启用步骤：
  #   1. 创建 Slack webhook：https://api.slack.com/apps → Incoming Webhooks
  #   2. 把下面 api_url 替换为实际 URL（格式：https://hooks.slack.com/services/T.../B.../XXX）
  #   3. 重启 alertmanager：sudo systemctl restart alertmanager
  #   (因 prom 已开 --web.enable-lifecycle，am 也建议 reload config: curl -XPOST http://127.0.0.1:9093/-/reload)
  - name: 'slack-warnings'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/T1234/B5678/AbCdEfGhIjKlMnOpQrStUvWx'  # PLACEHOLDER, 需替换
        channel: '#math-monitor-alerts'  # 实际 channel
#        send_resolved: true
        title: '[{{ .Status }}] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary*: {{ .Annotations.summary }}
          *Description*: {{ .Annotations.description }}
          *Runbook*: {{ .Annotations.runbook }}
          {{ end }}

inhibit_rules:
  # 如果 upstream down，抑制所有相关告警
  - source_match:
      alertname: 'UpstreamDown'
    target_match:
      service: 'math-sympy-http'
    equal: ['service']