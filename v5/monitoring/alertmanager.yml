# Alertmanager 配置 · M3 W6 告警渠道
#
# 加载方式（prometheus.yml）:
#   alerting:
#     alertmanagers:
#       - static_configs:
#           - targets: ['127.0.0.1:9093']
#
# 启用 webhook / Slack / email 任一即可

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'  # 可选：email
  smtp_from: 'alerts@example.com'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password: 'xxxxx'  # 替换为实际密码

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-warnings'
      continue: true

receivers:
  # 默认兜底：也走 PushPlus。
  # 原来这里是「未配置任何 integration」的空 receiver —— 没打 severity 标签的告警
  # 路由到 default 后被静默丢弃，等于规则写了等于没写（2026-10-28 修）。
  - name: 'default'
    webhook_configs:
      - url: 'http://127.0.0.1:5002/pushplus'
        send_resolved: true
        max_alerts: 0

  # 🔴 严重 / 🟡 warning 也统一推到 PushPlus（个人微信）  2026-09-21 启用
  # 流程：alertmanager → pushplus_bridge (:5002) → pushplus.plus API → 微信
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://127.0.0.1:5002/pushplus'
        send_resolved: true
        max_alerts: 0  # 0 = 所有 alert 一次推送

  # 🟡 warning 原先配的是 Slack 占位 URL（hooks.slack.com/services/T1234/...），
  # 从未注册成功、每次投递 404——留着就是一条「自称会告警」的静默失败路径。
  # 单机单通道：warning 改投 PushPlus，名字保留是为了不惊动已有的接收端断言。
  - name: 'slack-warnings'
    webhook_configs:
      - url: 'http://127.0.0.1:5002/pushplus'
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  # 如果 upstream down，抑制所有相关告警
  - source_match:
      alertname: 'UpstreamDown'
    target_match:
      service: 'math-sympy-http'
    equal: ['service']
