# llamafactory 训练配置 - v6 enriched (含 trigger 真值)
# 用法: llamafactory-cli train v5/audit/v6_enriched_train.yaml

model_name_or_path: qwen3-14b-tdx-v5  # 已有 checkpoint
adapter_name_or_path: outputs/v6_enriched_lora
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: q_proj,v_proj

# 数据
dataset: v6_enriched_alpaca
dataset_dir: v5/audit
template: qwen
max_samples: 5238
overwrite_cache: true
preprocessing_num_workers: 4

# 训练
output_dir: outputs/v6_enriched_lora
overwrite_output_dir: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
num_train_epochs: 3.0
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
logging_steps: 20
save_steps: 200
save_total_limit: 3
bf16: true
gradient_checkpointing: true

# 评估 (val)
val_size: 0.1
per_device_eval_batch_size: 1
evaluation_strategy: steps
eval_steps: 200

# 报告
report_to: wandb
run_name: v6_enriched_trigger_truth
