name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 增量阻断需要 diff base（origin/main...HEAD）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install ruff==0.16.7
      - name: 阻断项：语法错误与未定义名
        run: ruff check . --select E9,F63,F7,F82
      - name: 建议项：完整规则集（存量约 250 条，不阻断）
        continue-on-error: true
        run: ruff check . --statistics --ignore=E501
      - name: 增量阻断：新增行不得引入新违规 + 基线只降不升（ruff + 语义双维度）
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main || git fetch --no-tags origin main
          python scripts/ci_violation_gate.py check --base origin/main
      - name: 基线快照自检（基线不得低于实测 / 增长审批不得过期）
        run: python scripts/ci_violation_gate.py check --no-diff
      - name: 语义守卫明细（M-4 三条 AST 守卫）
        continue-on-error: true
        run: python scripts/ci_semantic_guard.py scan --limit 20
      - name: 质量债务趋势报告（29 条遗留问题的下降曲线）
        continue-on-error: true
        run: python scripts/quality_trend.py report
      - name: mypy 增量阻断（M-6：新增模块不得引入新类型错误）
        run: |
          set -euo pipefail
          pip install mypy==2.3.1
          python scripts/ci_typecheck_gate.py check
      - name: 修复必须附带测试（M-5：台账绑定 + 变更配对）
        run: python scripts/audit_fix_tests.py check --base origin/main
      - name: 格式化只检查不改文件（M-6 ①：CI 不得改工作树）
        continue-on-error: true
        run: ruff format --check . || true
