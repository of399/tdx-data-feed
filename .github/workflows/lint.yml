name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install ruff==0.16.7
      - name: 阻断项：语法错误与未定义名
        run: ruff check . --select E9,F63,F7,F82
      - name: 建议项：完整规则集（存量约 200 条，暂不阻断）
        continue-on-error: true
        run: ruff check . --statistics --ignore=E501
