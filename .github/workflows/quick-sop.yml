name: sop-quick

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sop-quick:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 安装业务依赖
        run: pip install -r requirements-ci.txt

      - name: Python 环境信息
        run: |
          {
            echo "--- python version ---"
            python --version
            echo "--- which python ---"
            which python
            echo "--- pip list (key deps) ---"
            pip list 2>&1 | grep -iE 'sympy|akshare|fastapi|mcp|httpx'
            echo "--- ls v5/mcp_math ---"
            ls v5/mcp_math/
            echo "--- ls v5/mcp_servers ---"
            ls v5/mcp_servers/
          } 2>&1 | tee /tmp/env-info.txt

      - name: 业务模块可导入性 smoke test
        run: |
          python - <<'PY'
          import v5.mcp_math.strategy_selector  # noqa: F401
          import v5.mcp_math.derivation  # noqa: F401
          import v5.mcp_math.math_cache  # noqa: F401
          import v5.mcp_servers.math_sympy  # noqa: F401
          import v5.mcp_servers.math_sympy_http  # noqa: F401
          print("smoke ok")
          PY

      - name: pytest (冒烟子集)
        run: |
          pytest tests/test_limit_single_source.py v5/tests/test_alerting_pipeline.py -q 2>&1 | tee /tmp/pytest-smoke.txt

      - name: 上传 CI 诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sop-diagnostics
          path: |
            /tmp/env-info.txt
            /tmp/pytest-smoke.txt
          retention-days: 7
