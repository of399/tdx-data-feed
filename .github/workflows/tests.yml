name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 安装测试依赖（精简集：不含训练栈与行情源）
        run: pip install -r requirements-ci.txt

      - name: 跑两个互不覆盖的测试集
        run: |
          set -o pipefail
          pytest tests/ v5/tests/ -q -p no:cacheprovider 2>&1 | tee /tmp/pytest.log

      - name: 通过数下限（防空跑即绿）
        if: always()
        run: |
          passed=$(grep -Eo '[0-9]+ passed' /tmp/pytest.log | tail -1 | grep -Eo '[0-9]+' || true)
          skipped=$(grep -Eo '[0-9]+ skipped' /tmp/pytest.log | tail -1 | grep -Eo '[0-9]+' || true)
          echo "passed=${passed:-0} skipped=${skipped:-0}"
          # 2026-11-01 复刻实测（CI 同构 venv：Python 3.14.4 + requirements-ci.txt；
          # 干净副本 + /home 遮蔽）：1177 passed / 80 skipped，2 条红均为复刻专属——
          # 本守卫在 tests.yml 更新前必红；bind-mount 让 console script shebang 指到被遮蔽路径，
          # CI 上该用例正常。故 CI 可达 ≈ 1179 passed / 80 skipped。
          # 本地无数据演练（TDX_TEST_DATA_ROOT=/nonexistent）为 1232 passed / 26 skipped，
          # 差额来自 CI 无 data/、/etc 单元、venv-math、告警栈/Ollama 时的运行期自跳过。
          # 下限 1140 = 1179 − 39 余量；skipped 上限 100 = 80 + 20 余量，
          # 两个方向都有界：空跑/整片失败压低 passed，整片 skip 抬高 skipped。
          test "${passed:-0}" -ge 1140
          test "${skipped:-0}" -le 100
