name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 安装测试依赖（精简集：不含训练栈与行情源）
        run: pip install -r requirements-ci.txt

      - name: 跑两个互不覆盖的测试集
        run: |
          set -o pipefail
          pytest tests/ v5/tests/ -q -p no:cacheprovider 2>&1 | tee /tmp/pytest.log

      - name: 通过数下限（防空跑即绿）
        if: always()
        run: |
          passed=$(grep -Eo '[0-9]+ passed' /tmp/pytest.log | tail -1 | grep -Eo '[0-9]+' || true)
          skipped=$(grep -Eo '[0-9]+ skipped' /tmp/pytest.log | tail -1 | grep -Eo '[0-9]+' || true)
          echo "passed=${passed:-0} skipped=${skipped:-0}"
          # CI 可达成值 ≈ 719 = 无数据演练 734（TDX_TEST_DATA_ROOT=/nonexistent）− 10 条本机专属 passed（v5/tests/test_ask_path_integration.py 8 + tests/test_math_unit_deployed_matches_repo.py 2；该文件 3 条里 1 条是不依赖部署的元守卫，CI 照过）− 5 条告警栈用例（test_alerting_pipeline.py::TestPipelineStatic，CI 无 9090/9093/8002 时 skip）；再留 19 条余量，覆盖 CI 上未枚举到的 skip 差异。
          test "${passed:-0}" -ge 700
