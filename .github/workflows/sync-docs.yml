name: sync-docs

# ============================================================
# 文档同步工作流
# ============================================================
# 自动化触发：
#   1. push 到 main 分支（文档变更）
#   2. PR 合入（preview 同步）
#   3. 每天 UTC 00:00（定时备份）
#   4. workflow_dispatch（手动触发）
#
# 同步目标：
#   - GitHub Wiki
#   - Obsidian Vault（仓库内）
#   - 文档预览（PR comment）
#
# 保留策略：
#   - 源文档修改 → 触发同步
#   - 哈希变化 → 标记为 outdated
# ============================================================

on:
  push:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'Makefile'
      - 'DELIVERY.md'
      - 'docs/**'
      - '.github/workflows/sync-docs.yml'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'Makefile'
      - 'DELIVERY.md'
      - 'docs/**'

  schedule:
    # 每天 UTC 00:00（即北京/上海时间 08:00）
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      target:
        description: '同步目标'
        required: true
        type: choice
        options:
          - vault
          - wiki
          - all
        default: 'all'

permissions:
  contents: write       # 允许 checkout 和 commit
  pull-requests: write  # 允许 PR 评论
  pages: write          # 允许部署 Pages（可选）

env:
  # 源仓库信息
  REPO_NAME: ${{ github.repository }}
  # Obsidian Vault 路径（仓库内）
  VAULT_PATH: docs/obsidian-vault
  # 文档源文件
  DOC_SOURCES: |
      README.md
      CONTRIBUTING.md
      SECURITY.md
      Makefile
      DELIVERY.md
      CHANGELOG.md
      docs/ARCHITECTURE.md
      docs/WORKFLOW.md
      docs/API.md
      docs/PLAN_E.md
      docs/PLAN_E_LIVE.md
      docs/tdx-data-feed-数据字典.md
      docs/volume-单位治理计划书.md

jobs:
  # ============== Job 1: 检测变更 ==============
  detect-changes:
    name: 检测文档变更
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      files: ${{ steps.check.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 检测变更文件
        id: check
        run: |
          # 如果是 PR：检测 PR 修改的文件
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path' 2>/dev/null || echo "")
          # 如果是 push：对比 HEAD~1
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only origin/${{ github.base_ref }} HEAD 2>/dev/null || echo "")
          # 定时或手动：全量同步
          else
            CHANGED=$(echo "$DOC_SOURCES" | tr '\n' ' ')
          fi

          # 过滤：只保留文档文件
          FILTERED=""
          for f in $CHANGED; do
            for src in $DOC_SOURCES; do
              if [ "$f" = "$src" ] || echo "$f" | grep -q "^$src\$"; then
                FILTERED="$FILTERED $f"
                break
              fi
            done
          done

          # 输出
          if [ -n "$FILTERED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            # JSON 数组
            JSON=$(echo "$FILTERED" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s .c)
            echo "files=$JSON" >> $GITHUB_OUTPUT
            echo "✓ 检测到 $(echo $FILTERED | wc -w) 个文档变更"
            echo "$FILTERED"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "files=[]" >> $GITHUB_OUTPUT
            echo "(无文档变更)"
          fi

  # ============== Job 2: 同步到 Obsidian Vault ==============
  sync-vault:
    name: 同步到 Obsidian Vault
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 同步文档到 Vault
        run: |
          set -e
          mkdir -p ${{ env.VAULT_PATH }}

          # 定义源 → 目标映射
          declare -A MAP=(
            ["README.md"]="${{ env.VAULT_PATH }}/00-知识库入口/README-项目总览.md"
            ["CONTRIBUTING.md"]="${{ env.VAULT_PATH }}/00-知识库入口/贡献指南.md"
            ["SECURITY.md"]="${{ env.VAULT_PATH }}/00-知识库入口/安全策略.md"
            ["DELIVERY.md"]="${{ env.VAULT_PATH }}/01-项目概览/DELIVERY-项目交付报告.md"
            ["docs/ARCHITECTURE.md"]="${{ env.VAULT_PATH }}/02-架构与工作流/ARCHITECTURE-架构决策.md"
            ["docs/WORKFLOW.md"]="${{ env.VAULT_PATH }}/02-架构与工作流/WORKFLOW-工作流全景.md"
            ["docs/API.md"]="${{ env.VAULT_PATH }}/03-开发与API/API-接口文档.md"
            ["Makefile"]="${{ env.VAULT_PATH }}/03-开发与API/Makefile-完整命令参考.md"
            ["docs/PLAN_E.md"]="${{ env.VAULT_PATH }}/04-策略与方案/PLAN_E-翻倍当日跟随策略.md"
            ["docs/PLAN_E_LIVE.md"]="${{ env.VAULT_PATH }}/04-策略与方案/PLAN_E_LIVE-实盘启动指南.md"
            ["docs/tdx-data-feed-数据字典.md"]="${{ env.VAULT_PATH }}/05-数据与配置/数据字典.md"
            ["docs/volume-单位治理计划书.md"]="${{ env.VAULT_PATH }}/05-数据与配置/volume-单位治理.md"
          )

          SYNCED=0
          FAILED=0

          for src in "${!MAP[@]}"; do
            dst="${MAP[$src]}"
            if [ -f "$src" ]; then
              mkdir -p "$(dirname "$dst")"

              # 计算哈希
              HASH=$(sha256sum "$src" | cut -c1-8)
              TODAY=$(date +%Y-%m-%d)
              LINES=$(wc -l < "$src")
              TITLE=$(basename "$dst" .md)

              # 写入 frontmatter + 内容
              {
                echo "---"
                echo "title: $TITLE"
                echo "source: $src"
                echo "source_hash: $HASH"
                echo "synced_at: $TODAY"
                echo "line_count: $LINES"
                echo "tags:"
                echo "  - tdx-data-feed"
                echo "  - documentation"
                echo "---"
                echo ""
                echo "<!--"
                echo "⚠️ 自动同步自 GitHub Actions"
                echo "源: $src · 哈希: $HASH · 行数: $LINES"
                echo "同步: $TODAY"
                echo "-->"
                echo ""
                cat "$src"
              } > "$dst"

              SYNCED=$((SYNCED + 1))
              echo "✓ 同步: $src → $dst ($LINES 行)"
            else
              FAILED=$((FAILED + 1))
              echo "⚠ 源文件不存在: $src"
            fi
          done

          echo ""
          echo "同步统计: 成功 $SYNCED, 失败 $FAILED"

      - name: 提交 Vault 变更
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ${{ env.VAULT_PATH }}
          if git diff --staged --quiet; then
            echo "(无变更需提交)"
          else
            git commit -m "docs(sync): 自动同步文档到 Vault ($(date +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
          fi

  # ============== Job 3: PR 预览评论 ==============
  pr-preview:
    name: PR 预览评论
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成预览
        id: preview
        run: |
          {
            echo "## 📚 文档同步预览"
            echo ""
            echo "### 变更摘要"
            echo ""
            echo "| 文件 | 状态 | 行数 | 哈希 |"
            echo "|---|---|---:|---|"

            for src in README.md CONTRIBUTING.md SECURITY.md Makefile DELIVERY.md \
                       docs/ARCHITECTURE.md docs/WORKFLOW.md docs/API.md \
                       docs/PLAN_E.md docs/PLAN_E_LIVE.md; do
              if [ -f "$src" ]; then
                LINES=$(wc -l < "$src")
                HASH=$(sha256sum "$src" | cut -c1-8)
                echo "| \`$src\` | ✅ 同步 | $LINES | \`$HASH\` |"
              fi
            done

            echo ""
            echo "### 同步目标"
            echo "- ✅ Obsidian Vault (\`${{ env.VAULT_PATH }}\`)"
            echo "- ✅ 本 PR 自动预览"
            echo ""
            echo "### 验收清单"
            echo "- [ ] 文档结构完整"
            echo "- [ ] 链接正确（无 404）"
            echo "- [ ] 代码示例可执行"
            echo "- [ ] 表格 / 图表渲染正常"
            echo ""
            echo "_🤖 自动生成于 $(date +'%Y-%m-%d %H:%M:%S') UTC_"
          } > preview.md

          cat preview.md

      - name: 评论到 PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-sync
          path: preview.md

  # ============== Job 4: 部署文档站点（可选）==============
  docs-site:
    name: 部署文档站点
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 合并所有文档
        run: |
          mkdir -p site
          {
            echo "# tdx-data-feed 文档"
            echo ""
            echo "> 自动生成于 $(date +'%Y-%m-%d %H:%M:%S')"
            echo ""
            for f in README.md CONTRIBUTING.md SECURITY.md DELIVERY.md \
                     docs/ARCHITECTURE.md docs/WORKFLOW.md docs/API.md \
                     docs/PLAN_E.md docs/PLAN_E_LIVE.md; do
              if [ -f "$f" ]; then
                echo "---"
                echo ""
                echo "## 来源: $f"
                echo ""
                cat "$f"
                echo ""
              fi
            done
          } > site/ALL_DOCS.md

          echo "✓ 合并文档完成: site/ALL_DOCS.md"

      - name: 上传 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30

  # ============== Job 5: 通知 ==============
  notify:
    name: 通知结果
    needs: [detect-changes, sync-vault]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 总结
        run: |
          echo "## 📊 文档同步总结"
          echo ""
          echo "| Job | 状态 |"
          echo "|---|---|"
          echo "| detect-changes | ${{ needs.detect-changes.result }} |"
          echo "| sync-vault | ${{ needs.sync-vault.result }} |"
          echo ""
          if [ "${{ needs.detect-changes.outputs.changed }}" = "true" ]; then
            echo "✓ 检测到变更"
            echo '变更文件:'
            echo '${{ needs.detect-changes.outputs.files }}'
          else
            echo "(无变更)"
          fi

# ============================================================
# 配置说明
# ============================================================
# 1. 启用：自动触发，无需额外配置
# 2. 权限：默认使用 GITHUB_TOKEN，无需手动添加 secret
# 3. 同步范围：
#    - README.md / CONTRIBUTING.md / SECURITY.md / Makefile / DELIVERY.md
#    - docs/ 目录下所有 .md 文件
# 4. 同步目标：
#    - 仓库内 Vault：docs/obsidian-vault/
# 5. 触发条件：
#    - push 到 main/develop 触发完整同步
#    - PR 触发预览评论
#    - 每天 0 点定时同步
#    - workflow_dispatch 手动触发
# 6. 失败处理：
#    - 同步失败会保留旧版本 Vault
#    - PR 预览评论会显示哪些文件有问题
# ============================================================